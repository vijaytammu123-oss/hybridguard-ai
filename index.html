<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>HybridGuard AI</title>  <style>    * { box-sizing: border-box; }    body { background: #07090e; color: #f1f5f9; font-family: Arial, sans-serif; margin: 0; padding: 28px; }    .box { max-width: 820px; margin: 0 auto; background: #0f1420; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; }    h1 { margin: 0; font-size: 24px; color: #38bdf8; }    .sub { color: #94a3b8; font-size: 13px; margin: 4px 0 16px; }    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }    select, textarea { background: #090d16; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 14px; }    select { background: #161f33; }    textarea { width: 100%; resize: vertical; }    button { background: #0284c7; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }    button:hover { background: #0369a1; }    button.sec { background: #1e293b; color: #e2e8f0; }    button.sec:hover { background: #334155; }    .badge { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #1e293b; color: #e2e8f0; }    .nano { background: #064e3b; color: #6ee7b7; }    .cloud { background: #1e3a8a; color: #93c5fd; }    .high { background: #7f1d1d; color: #fca5a5; }    .med { background: #78350f; color: #fcd34d; }    .low { background: #14532d; color: #86efac; }    pre { background: #06080d; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; white-space: pre-wrap; line-height: 1.55; margin-top: 14px; min-height: 140px; }  </style></head><body>  <div class="box">    <h1>HybridGuard AI</h1>    <div class="sub">On-Device Gemini Nano + Firebase AI Logic Cloud Fallback</div>    <textarea id="promptInput" rows="4" placeholder="Paste suspicious message, email, link, or prompt..."></textarea>    <div class="row">      <label for="modeSelect">Mode:</label>      <select id="modeSelect">        <option value="auto">Auto Hybrid (Nano First, Cloud Fallback)</option>        <option value="nano">Force On-Device (Gemini Nano)</option>        <option value="cloud">Force Cloud (Firebase AI Logic)</option>      </select>    </div>    <div class="row">      <button id="runBtn">Analyze Threat</button>      <button id="samplePhishBtn" class="sec" type="button">Load Phishing Sample</button>      <button id="sampleSafeBtn" class="sec" type="button">Load Safe Sample</button>      <button id="clearBtn" class="sec" type="button">Clear</button>    </div>    <div class="row">      <span id="sourceBadge" class="badge">Source: Idle</span>      <span id="riskBadge" class="badge">Risk: Pending</span>      <span id="latencyBadge" class="badge">Time: 0 ms</span>    </div>    <pre id="output">Ready. Enter text or load a sample.</pre>  </div>  <script type="module" src="/src/main.js"></script></body></html>
